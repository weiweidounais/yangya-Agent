# /etc/nginx/sites-available/langfuse  →  ln -s ../sites-available/langfuse /etc/nginx/sites-enabled/
# TLS via certbot: sudo certbot --nginx -d langfuse.example.com
# Replace langfuse.example.com everywhere.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name langfuse.example.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name langfuse.example.com;

    ssl_certificate     /etc/letsencrypt/live/langfuse.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/langfuse.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # OTLP span batches and dataset uploads.
    client_max_body_size 20m;

    # Optional: restrict the UI to office / VPN ranges; keep /api/public open for
    # the app and CI (they authenticate with project API keys).
    # location / { allow 203.0.113.0/24; deny all; proxy_pass http://127.0.0.1:3000; ... }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}
