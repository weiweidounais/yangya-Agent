# Nightly live golden: every case runs 3 times against the real vendors.
# Safety cases (crisis / leak / fabrication / invariants) must pass all 3 runs
# (pass^3); quality is the per-run pass rate vs baseline.json "live". Replies are
# scored by the rubric judges (LLM judge on the strong tier). With LANGFUSE_*
# secrets the run is recorded as a Langfuse dataset run (dataset golden-live) with
# golden.pass / judge.* scores, so nights can be compared in the Langfuse UI.
# Never deploys. Skips cleanly (exit 0, notice) when no LLM key secret is set.
name: Golden Nightly (live)

on:
  schedule:
    - cron: "17 19 * * *" # 03:17 Asia/Shanghai
  workflow_dispatch:
    inputs:
      repeat:
        description: "Runs per case"
        default: "3"
      only:
        description: "Comma-separated categories / case ids (empty = all)"
        default: ""

permissions:
  contents: read

concurrency:
  group: golden-nightly
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LLM_FAST_API_KEY: ${{ secrets.LLM_FAST_API_KEY }}
      LLM_STRONG_API_KEY: ${{ secrets.LLM_STRONG_API_KEY }}
      LLM_FAST_BASE_URL: ${{ vars.LLM_FAST_BASE_URL }}
      LLM_STRONG_BASE_URL: ${{ vars.LLM_STRONG_BASE_URL }}
      LLM_FAST_MODEL: ${{ vars.LLM_FAST_MODEL }}
      LLM_STRONG_MODEL: ${{ vars.LLM_STRONG_MODEL }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      LLM_PRICES_JSON: ${{ vars.LLM_PRICES_JSON }}
      LANGFUSE_ENABLED: ${{ secrets.LANGFUSE_SECRET_KEY != '' && '1' || '0' }}
      LANGFUSE_HOST: ${{ vars.LANGFUSE_HOST }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_ENVIRONMENT: ci-nightly
      LANGFUSE_RELEASE: ${{ github.sha }}
      JUDGE_MODE: auto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.lock
      - run: pip install -r requirements.txt -r requirements-dev.txt -c requirements.lock
      - name: Check LLM secrets
        id: keys
        run: |
          if [ -n "$LLM_FAST_API_KEY$LLM_STRONG_API_KEY$DEEPSEEK_API_KEY$KIMI_API_KEY$DASHSCOPE_API_KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No LLM key secret configured; nightly live golden skipped."
          fi
      - name: Golden live x${{ inputs.repeat || '3' }}
        if: steps.keys.outputs.ok == 'true'
        run: |
          python tests/golden/run_golden.py --mode live \
            --repeat "${{ inputs.repeat || '3' }}" \
            --only "${{ inputs.only }}" \
            --judge --langfuse \
            --run-name "nightly-$(date -u +%Y%m%d)-${GITHUB_SHA::7}" \
            --report-json golden-nightly.json --report-md golden-nightly.md
      - uses: actions/upload-artifact@v4
        if: always() && steps.keys.outputs.ok == 'true'
        with:
          name: golden-nightly-${{ github.run_id }}
          path: golden-nightly.*
          retention-days: 30
