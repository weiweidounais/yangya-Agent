# Harness regression: unit tests + golden cases (mock LLM). Never deploys.
#
# Gate (tests/golden/run_golden.py): safety categories (crisis / leak /
# fabrication / harness invariants) must have zero failures; quality cases are
# compared against tests/golden/baseline.json. A safety failure can never be
# averaged away by the overall pass rate.
#
# Runs on every push (main included) and PR. Deploys are manual: deploy-render.yml
# (workflow_dispatch) re-runs this gate via workflow_call and its deploy job
# `needs` it for the same commit.
# Live mode (real vendor keys) is opt-in via "Run workflow" and repo secrets.
name: Harness Golden

on:
  pull_request:
  push:
  workflow_call:
    inputs:
      live:
        type: boolean
        default: false
      min_pass_rate:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      live:
        description: "Also run golden cases against the real LLM (needs secrets)"
        type: boolean
        default: false
      min_pass_rate:
        description: "Live quality pass-rate threshold 0..1 (empty = baseline.json). Safety always needs 0 failures."
        default: ""

permissions:
  contents: read

jobs:
  golden-mock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTH_SECRET: "golden-mock-test-only-not-a-real-secret"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements.lock
      - run: pip install -r requirements.txt -r requirements-dev.txt -c requirements.lock
      - name: Verify no local embedding stack
        run: python -c "import importlib.util; assert all(importlib.util.find_spec(m) is None for m in ('torch', 'sentence_transformers'))"
      - name: Full pytest
        run: python -m pytest -q
      - name: Prompt-injection regression tests
        run: python -m pytest tests/test_prompt_injection.py -q
      - name: Golden (rules, mock LLM)
        env:
          INTENT_SCORING_MODE: rules
        run: python tests/golden/run_golden.py --mode mock --judge-gate --report-json golden-report.json --report-md golden-report.md
      - name: Golden (hybrid, mock scorer and LLM)
        run: python tests/golden/run_hybrid.py --mode mock --judge-gate --report-json golden-report-hybrid.json --report-md golden-report-hybrid.md
      - name: Legacy harness smoke
        run: python scripts/harness_golden.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-report-mock
          path: golden-report*

  postgres-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: personal_agent_rls_test
          # Disposable CI service only; no permanent DB or stored credentials.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d personal_agent_rls_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements.lock
      - run: pip install -r requirements.txt -r requirements-dev.txt -c requirements.lock
      - name: Postgres RLS acceptance tests (required, no availability skips)
        env:
          RLS_TEST_DATABASE_URL: postgresql+psycopg://postgres@localhost:55432/personal_agent_rls_test
          RLS_TEST_REQUIRED: "1"
        run: python -m pytest -q tests/test_pg_rls.py

  golden-live:
    if: inputs.live == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt -c requirements.lock
      - name: Golden (live LLM)
        env:
          LLM_FAST_API_KEY: ${{ secrets.LLM_FAST_API_KEY }}
          LLM_STRONG_API_KEY: ${{ secrets.LLM_STRONG_API_KEY }}
          LLM_FAST_MODEL: ${{ vars.LLM_FAST_MODEL }}
          LLM_STRONG_MODEL: ${{ vars.LLM_STRONG_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          GOLDEN_MIN_PASS_RATE: ${{ inputs.min_pass_rate }}
        run: python tests/golden/run_golden.py --mode live --report-json golden-report.json --report-md golden-report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-report-live
          path: golden-report.*
